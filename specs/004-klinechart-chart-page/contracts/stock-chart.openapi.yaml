openapi: 3.0.3
info:
  title: Stock Chart API
  version: "1.0"
  description: API contracts for chart page and market data usage.
servers:
  - url: /
paths:
  /api/stocks/kline/{symbol}:
    get:
      summary: Get K line series for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: Stock ticker symbol
        - name: provider
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Quote provider identifier. Supported values: `longbridge`, `default`
      responses:
        "200":
          description: K line series response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KLineSeriesResponse"
        "400":
          description: Invalid symbol or provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API limit exceeded
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unknown error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Network error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/stocks/quote/{symbol}:
    get:
      summary: Get latest stock quote for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: Stock ticker symbol
        - name: provider
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Quote provider identifier. Supported values: `longbridge`, `default`
      responses:
        "200":
          description: Stock quote response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockQuoteResponse"
        "400":
          description: Invalid symbol or provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unknown error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Network error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    APIErrorCode:
      type: string
      enum:
        - INVALID_SYMBOL
        - INVALID_PROVIDER
        - API_LIMIT_EXCEEDED
        - NETWORK_ERROR
        - INVALID_API_KEY
        - UNKNOWN_ERROR
    APIError:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/APIErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    APIResponseBase:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          nullable: true
          $ref: "#/components/schemas/APIError"
        timestamp:
          type: string
          format: date-time
      required:
        - success
        - data
        - error
        - timestamp
    Stock:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
      required:
        - symbol
        - name
        - price
        - change
        - changePercent
    StockQuote:
      allOf:
        - $ref: "#/components/schemas/Stock"
        - type: object
          properties:
            volume:
              type: number
            high:
              type: number
            low:
              type: number
            open:
              type: number
            previousClose:
              type: number
            marketCap:
              type: number
              nullable: true
            peRatio:
              type: number
              nullable: true
            eps:
              type: number
              nullable: true
            dividendYield:
              type: number
              nullable: true
            week52High:
              type: number
              nullable: true
            week52Low:
              type: number
              nullable: true
            avgVolume:
              type: number
              nullable: true
            beta:
              type: number
              nullable: true
            lastUpdated:
              type: string
              format: date-time
          required:
            - volume
            - high
            - low
            - open
            - previousClose
            - lastUpdated
    TimeRange:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        interval:
          type: string
          enum:
            - 1d
      required:
        - startDate
        - endDate
        - interval
    KLineCandle:
      type: object
      properties:
        timestamp:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - timestamp
        - open
        - high
        - low
        - close
        - volume
    KLineSeries:
      type: object
      properties:
        symbol:
          type: string
        range:
          $ref: "#/components/schemas/TimeRange"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/KLineCandle"
        lastUpdated:
          type: string
          format: date-time
      required:
        - symbol
        - range
        - candles
        - lastUpdated
    KLineSeriesResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/KLineSeries"
        error:
          nullable: true
          type: object
        timestamp:
          type: string
          format: date-time
      required:
        - success
        - data
        - error
        - timestamp
    StockQuoteResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/StockQuote"
        error:
          nullable: true
          type: object
        timestamp:
          type: string
          format: date-time
      required:
        - success
        - data
        - error
        - timestamp
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
          type: object
        error:
          $ref: "#/components/schemas/APIError"
        timestamp:
          type: string
          format: date-time
      required:
        - success
        - data
        - error
        - timestamp
