openapi: 3.0.3
info:
  title: Watchlist API
  version: 1.0.0
  description: Persisted watchlist operations for authenticated users.
paths:
  /api/watchlist:
    get:
      summary: Load watchlist
      description: Returns the current user's persisted watchlist.
      responses:
        '200':
          description: Watchlist loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Update watchlist
      description: Adds or removes a symbol from the current user's watchlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistMutationRequest'
      responses:
        '200':
          description: Watchlist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    WatchlistMutationRequest:
      type: object
      required:
        - action
        - symbol
      properties:
        action:
          type: string
          enum: [add, remove]
        symbol:
          type: string
          description: Ticker symbol, normalized to uppercase.
    WatchlistResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - watchlist
          properties:
            watchlist:
              type: array
              items:
                type: string
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
